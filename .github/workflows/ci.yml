name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # macOS 26 SDK required: the panel backdrop uses NSGlassEffectView (macOS 26),
    # which must exist at compile time even though it's #available-gated at runtime.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only the repo owner bumps the version (at release time). Fail a PR from
      # anyone else that touches MARKETING_VERSION so it's enforced, not just asked.
      - name: Guard MARKETING_VERSION
        if: github.event_name == 'pull_request' && github.event.pull_request.author_association != 'OWNER'
        run: |
          if git diff "${{ github.event.pull_request.base.sha }}" HEAD -- project.yml | grep -qE '^[+-].*MARKETING_VERSION'; then
            echo "::error::Don't change MARKETING_VERSION in project.yml — the maintainer bumps the version at release."
            exit 1
          fi
      # Lint. Runs here (not locally) because SwiftLint needs a full toolchain
      # the CLT-only dev machine lacks. Advisory: `|| true` keeps it from blocking
      # while the baseline is unverified — annotations still show on the PR. Drop
      # `|| true` (and add --strict) to make it enforcing once a run is clean.
      #
      # The macos-26 image ships no swiftlint, so the lint step used to hit
      # "command not found" that `|| true` swallowed, making it a silent no-op.
      # Install it explicitly; the runner has full Xcode so its SourceKit loads.
      - name: Install SwiftLint
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint
      - name: Lint (SwiftLint, advisory)
        run: swiftlint lint --reporter github-actions-logging || true
      # Reuses the release script's dry run: compiles the universal binary,
      # builds the icon, compiles the String Catalog, and packages the DMG,
      # so a green check means the real release path builds. Publishes nothing.
      - name: Build (release dry run)
        run: ./scripts/release.sh v0.0.0-ci
