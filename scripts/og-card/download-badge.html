<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 776px; height: 262px; background: transparent; }
  .btn {
    width: 776px; height: 262px; border-radius: 52px;
    background: #000; border: 14px solid #fff;
    display: flex; align-items: center; justify-content: center; gap: 100px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: #fff;
  }
  .logo { font-size: 172px; line-height: 1; margin-top: -26px; }
  .txt { display: flex; flex-direction: column; align-items: flex-end; margin-top: -8px; }
  .txt small { font-size: 60px; font-weight: 400; line-height: 1; margin-bottom: 8px; white-space: nowrap; }
  .txt span { font-size: 108px; font-weight: 600; line-height: 1; }
</style>
</head>
<body>
  <div class="btn">
    <div class="logo">&#63743;</div>
    <div class="txt">
      <small>Download app for</small>
      <span>macOS</span>
    </div>
  </div>
</body>
</html>
