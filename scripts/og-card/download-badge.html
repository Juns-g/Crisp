<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 776px; height: 262px; background: transparent; }
  .btn {
    width: 776px; height: 262px; border-radius: 44px;
    background: #000; border: 5px solid #fff;
    display: flex; align-items: center; justify-content: center; gap: 34px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: #fff;
  }
  .logo { font-size: 170px; line-height: 1; margin-top: -22px; }
  .txt { display: flex; flex-direction: column; align-items: flex-start; }
  .txt small { font-size: 50px; font-weight: 400; letter-spacing: .01em; margin-bottom: 2px; }
  .txt span { font-size: 124px; font-weight: 500; letter-spacing: -.01em; line-height: .95; }
</style>
</head>
<body>
  <div class="btn">
    <div class="logo">&#63743;</div>
    <div class="txt">
      <small>Download app for</small>
      <span>macOS</span>
    </div>
  </div>
</body>
</html>
